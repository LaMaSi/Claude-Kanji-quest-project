<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Tanuki Sensei</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top"><div id="stats"></div></header>
  <main id="main">
    <div id="stage"><canvas id="art"></canvas><div class="lcd"></div></div>
    <h1 id="loc"></h1>
    <section id="text"></section>
    <section id="widget"></section>
    <div id="newkanji"></div>
    <nav id="choices"></nav>
  </main>
</div>
<footer id="dock">
  <div class="seg" id="scriptsw" role="group" aria-label="Schrift">
    <button data-m="kanji" aria-label="Kanji">漢</button><button data-m="kana" aria-label="Hiragana">あ</button><button data-m="romaji" aria-label="Rōmaji">A</button>
  </div>
  <button id="bFuri" class="dbtn" aria-label="Furigana">ふ</button>
  <button id="bHelp" class="dbtn" aria-label="Deutsche Hilfe">DE</button>
  <button id="bMenu" class="dbtn" aria-label="Menü">☰</button>
</footer>
<div id="overlay" hidden><div id="sheet"></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
